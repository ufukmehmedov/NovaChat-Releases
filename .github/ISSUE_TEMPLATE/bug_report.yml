name: Bug report
description: Report a reproducible NovaChat or NovaRelay problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve NovaChat. Do not include passwords, keys, message contents, public IP addresses or other personal information.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android
        - Linux
        - Windows
        - NovaRelay
        - Installer or updater
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Example: 0.7.21-android-alpha44
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Example: Android 16, Ubuntu 24.04 or Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest exact sequence that causes the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove passwords, keys, IP addresses, message contents and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and personal information from this report.
          required: true
