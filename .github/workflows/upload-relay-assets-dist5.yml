name: Upload relay installation assets to dist.5

on:
  push:
    branches:
      - release/upload-relay-assets-dist5

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate shell installers
        run: |
          bash -n install.sh
          bash -n install-relay.sh
      - name: Upload installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.7.21-dist.5 INSTALL.md RELAY_INSTALL.md install-relay.sh --repo ufukmehmedov/NovaChat-Releases --clobber
