name: Bootstrap Installer CI

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - bootstrap-release.txt
      - .github/workflows/bootstrap-smoke.yml
  workflow_dispatch:

jobs:
  linux-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh
      - name: Install from public release
        env:
          HOME: ${{ runner.temp }}/novachat-home
        run: |
          set -euo pipefail
          bash install.sh
          test -x "$HOME/.local/bin/novachat"
          test -x "$HOME/.local/lib/novachat/novachat"

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and update while NovaChat is running
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "NovaChatLocalAppData"

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Initial bootstrap install failed." }

          $exe = Join-Path $env:LOCALAPPDATA "NovaChat\bin\novachat.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "NovaChat executable was not installed: $exe" }

          # Windows locks the executable image of a running process. Replace the
          # installed test binary with ping.exe, launch it as novachat.exe, then
          # ensure the bootstrap updater stops it before installing NovaChat again.
          Copy-Item -LiteralPath "$env:SystemRoot\System32\ping.exe" -Destination $exe -Force
          $running = Start-Process -FilePath $exe -ArgumentList @("127.0.0.1", "-n", "30") -PassThru -WindowStyle Hidden
          Start-Sleep -Milliseconds 500
          if ($running.HasExited) { throw "Lock simulation process exited too early." }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap update with running NovaChat failed." }

          $running.Refresh()
          if (-not $running.HasExited) { throw "Bootstrap installer did not stop the running NovaChat process." }
          if (-not (Test-Path -LiteralPath $exe)) { throw "NovaChat executable disappeared after update." }
